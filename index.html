<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>직업 인터뷰</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
:root{
  --bg:#E6EFF3; --paper:#FFFFFF; --ink:#1B2A4E; --muted:#56667F;
  --sun:#FFC247; --mint:#2FB496; --mint-soft:#E1F5EF; --line:#BFD3DD; --soft:#F3F8FA;
  --font-head:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  --font-body:'Gowun Dodum','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:18px;line-height:1.6}
.hidden{display:none !important}
button{font-family:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* 공통 버튼 */
.btn{font:inherit;font-weight:700;padding:12px 22px;border:2px solid var(--ink);border-radius:12px;background:var(--sun);color:var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:0 4px 0 var(--ink)}
.btn.mint{background:var(--mint)}
.btn.ghost{background:#fff}

/* ── 시작 화면 ── */
#screenStart{min-height:100vh;min-height:100dvh;max-width:1200px;margin:0 auto;padding:28px 40px;display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:36px;align-items:center}
.intro h1{font-family:var(--font-head);font-weight:400;font-size:52px;line-height:1.1;margin:0 0 12px}
.intro p{margin:0 0 24px;color:var(--muted)}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;margin-bottom:6px}
.field input,.custom input{width:100%;font:inherit;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
.start-msg{min-height:1.6em;margin:12px 0 0;color:#B3341F;font-weight:700}
.jobs-panel{background:var(--paper);border:2px solid var(--ink);border-radius:16px;padding:22px 26px}
.jobs-title{font-family:var(--font-head);font-weight:400;font-size:26px;margin:0 0 14px}
.job-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.job-btn{display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 6px;background:var(--soft);border:2px solid var(--line);border-radius:12px;font-size:17px;color:var(--ink)}
.job-btn .e{font-size:30px;line-height:1.3}
.job-btn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.custom{margin-top:16px}
.custom label{display:block;font-weight:700;margin-bottom:6px}

/* ── 면담 화면 ── */
#screenInterview{height:100vh;height:100dvh;max-width:1300px;margin:0 auto;padding:20px;display:grid;grid-template-columns:300px 1fr;gap:22px}
.tag{align-self:start;position:relative;margin-top:36px;background:var(--paper);border:2px solid var(--ink);border-radius:18px;padding:44px 18px 20px;text-align:center}
.tag::before{content:"";position:absolute;top:14px;left:50%;width:56px;height:12px;margin-left:-28px;border:2px solid var(--ink);border-radius:8px;background:var(--bg)}
.tag::after{content:"";position:absolute;top:-34px;left:50%;width:16px;height:34px;margin-left:-8px;background:var(--sun);border:2px solid var(--ink);border-bottom:none}
.avatar{font-size:76px;line-height:1.15}
.role{font-size:15px;color:var(--muted)}
.job{font-family:var(--font-head);font-size:32px;line-height:1.2;margin:4px 0 14px;word-break:keep-all}
.checklist{border-top:2px solid var(--ink);padding-top:10px;text-align:left}
.ck{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:3px 0;font-size:16px;font-weight:700}
.ck-dots{display:flex;gap:6px}
.dot{width:24px;height:24px;border-radius:50%;border:2px solid var(--ink);background:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:14px;line-height:1;font-weight:700;color:var(--ink)}
.dot.on{background:var(--sun)}
.remain{margin-top:10px;font-size:16px;color:var(--muted)}
.note{display:flex;flex-direction:column;min-height:0;background:#fff;border:2px solid var(--ink);border-radius:16px;overflow:hidden}
.chat{flex:1;min-height:0;overflow-y:auto;padding:22px 26px 10px;background-image:repeating-linear-gradient(to bottom,transparent 0,transparent 35px,#E3EEF4 35px,#E3EEF4 36px);background-attachment:local}
.msg{display:flex;margin:0 0 14px}
.msg.me{justify-content:flex-end}
.bubble{max-width:78%;padding:10px 16px;border:2px solid var(--ink);border-radius:16px;white-space:pre-wrap;word-break:keep-all;overflow-wrap:anywhere}
.msg.them .bubble{background:var(--mint-soft);border-bottom-left-radius:4px}
.msg.me .bubble{background:var(--sun);border-bottom-right-radius:4px}
.typing{display:inline-flex;gap:6px;padding:14px 18px}
.typing i{width:9px;height:9px;border-radius:50%;background:var(--ink);opacity:.35;animation:blink 1s infinite}
.typing i:nth-child(2){animation-delay:.2s}
.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}
.compose{display:flex;gap:10px;padding:14px 18px;border-top:2px solid var(--ink);background:var(--soft)}
.compose input{flex:1;min-width:0;font:inherit;padding:12px 14px;border:2px solid var(--ink);border-radius:10px;background:#fff;color:var(--ink)}
.finish{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 20px;border-top:2px solid var(--ink);background:var(--mint-soft);font-weight:700}
.ai-note{padding:6px 18px;border-top:1px dashed var(--line);background:#fff;font-size:14px;line-height:1.4;color:var(--muted);text-align:center}

/* ── 차단 화면 ── */
#screenBlocked{min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px}
.block-box{max-width:640px;width:100%;padding:44px 40px;background:#fff;border:3px solid #B3341F;border-radius:20px;text-align:center}
.block-icon{font-size:72px;line-height:1.1}
.block-box h2{font-family:var(--font-head);font-weight:400;font-size:46px;margin:6px 0 10px;color:#B3341F}
.block-box p{margin:0 0 8px;font-size:22px;line-height:1.5}
.block-box .block-sub{font-family:var(--font-head);font-size:28px;margin-top:16px}

/* ── 결과 화면 ── */
#screenResult{max-width:1200px;margin:0 auto;padding:24px 32px 40px;display:grid;grid-template-columns:230px 1fr;gap:26px;align-items:start}
.actions{position:sticky;top:24px;display:flex;flex-direction:column;gap:14px}
.sheet{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:28px 34px}
.sheet h2{font-family:var(--font-head);font-weight:400;font-size:32px;line-height:1.25;margin:0 0 4px}
.sheet .meta{color:var(--muted);margin:0 0 6px}
.sheet .meta span{margin-right:18px}
.sheet h3{font-family:var(--font-head);font-weight:400;font-size:23px;margin:24px 0 10px;padding-bottom:4px;border-bottom:2px solid var(--ink)}
.qa{margin:0 0 12px}
.qa .q{font-weight:700}
.qa .a{color:#34425F;padding-left:1.7em}
.badge{display:inline-block;margin:0 6px 0 2px;padding:0 9px;border:2px solid var(--ink);border-radius:999px;background:var(--sun);font-size:14px;font-weight:700;line-height:1.5;vertical-align:1px}
.summary{margin:0 0 6px}
.crit{display:grid;grid-template-columns:190px 1fr;gap:14px;padding:10px 0;border-bottom:1px dashed var(--line)}
.crit .name{font-weight:700}
.stars{display:block;color:#D98A00;font-size:22px;letter-spacing:2px;line-height:1.3}
.callout{margin-top:14px;padding:12px 16px;border:2px solid var(--ink);border-radius:12px}
.callout.good{background:var(--mint-soft)}
.callout.next{background:#FFF3D1}
.callout b{display:block;font-family:var(--font-head);font-weight:400;font-size:19px}

/* ── 안내 ── */
.overlay{position:fixed;inset:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(27,42,78,.55)}
.overlay .box{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:28px 38px;font-family:var(--font-head);font-size:24px;text-align:center}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);z-index:30;max-width:90vw;padding:12px 22px;background:var(--ink);color:#fff;border-radius:12px;font-weight:700}

/* 세로로 좁은 화면이나 낮은 가로 화면 대응 */
@media (max-width:820px){
  #screenStart,#screenResult{grid-template-columns:1fr}
  #screenInterview{grid-template-columns:1fr;grid-template-rows:auto 1fr;height:auto;min-height:100dvh}
  .tag{margin-top:34px}
  .note{min-height:60vh}
  .actions{position:static;flex-direction:row;flex-wrap:wrap}
  .crit{grid-template-columns:1fr}
}
@media (max-height:700px) and (min-width:821px){
  .intro h1{font-size:40px}
  .avatar{font-size:48px}
  .job{font-size:26px;margin-bottom:8px}
  .tag{padding-top:38px}
  .ck{padding:1px 0}
}
@media (prefers-reduced-motion:reduce){
  .typing i{animation:none;opacity:.6}
  .btn{transition:none}
}
</style>
</head>
<body>

<!-- 1. 시작 화면 -->
<main id="screenStart">
  <section class="intro">
    <h1>직업 인터뷰</h1>
    <p>궁금한 직업을 골라 그 직업의 사람을 만나 봐요. 질문은 <b id="qCountText">7</b>번 할 수 있어요.</p>
    <div class="field">
      <label for="studentName">번호와 이름</label>
      <input id="studentName" type="text" maxlength="12" placeholder="예: 7 김하늘" autocomplete="off">
    </div>
    <button class="btn" id="startBtn" type="button" disabled>면담 시작하기</button>
    <p class="start-msg" id="startMsg" role="alert"></p>
  </section>
  <section class="jobs-panel">
    <h2 class="jobs-title">어떤 직업을 만나 볼까요?</h2>
    <div class="job-grid" id="jobGrid"></div>
    <div class="custom">
      <label for="customJob">목록에 없다면 직접 써요</label>
      <input id="customJob" type="text" maxlength="20" placeholder="예: 방송 작가" autocomplete="off">
    </div>
  </section>
</main>

<!-- 2. 면담 화면 -->
<main id="screenInterview" class="hidden">
  <aside class="tag" aria-label="면담 상대와 질문 진행 상황">
    <div class="avatar" id="tagEmoji"></div>
    <div class="role">오늘의 면담 상대</div>
    <div class="job" id="tagJob"></div>
    <div class="checklist" id="checklist"></div>
    <div class="remain" id="remain"></div>
  </aside>
  <section class="note">
    <div class="chat" id="chat" aria-live="polite"></div>
    <div class="compose" id="compose">
      <input id="qInput" type="text" maxlength="200" placeholder="궁금한 것을 질문해 보세요" autocomplete="off">
      <button class="btn" id="sendBtn" type="button">질문하기</button>
    </div>
    <div class="finish hidden" id="finishBar">
      <span>질문을 모두 했어요. 수고했어요!</span>
      <button class="btn mint" id="feedbackBtn" type="button">피드백 받기</button>
    </div>
    <div class="ai-note">AI의 대답은 틀릴 수 있어요. 중요한 내용은 책이나 선생님께 꼭 확인해 보세요.</div>
  </section>
</main>

<!-- 3. 결과 화면 -->
<main id="screenResult" class="hidden">
  <div class="actions">
    <button class="btn" id="copyBtn" type="button">텍스트로 복사하기</button>
    <button class="btn mint" id="imgBtn" type="button">이미지로 저장하기</button>
    <button class="btn ghost" id="againBtn" type="button">처음으로</button>
  </div>
  <article class="sheet" id="sheet"></article>
</main>

<!-- 4. 차단 화면 -->
<main id="screenBlocked" class="hidden">
  <div class="block-box" role="alert">
    <div class="block-icon">⚠️</div>
    <h2>경고</h2>
    <p id="blockMsg">성적이거나 폭력적인 질문은 할 수 없어요. 면담이 끝났어요.</p>
    <p class="block-sub">선생님께 말씀드려요.</p>
  </div>
</main>

<div class="overlay hidden" id="overlay"><div class="box">면담 내용을 살펴보고 있어요...</div></div>
<div class="toast hidden" id="toast" role="status"></div>

<script>
(function(){
  // 직업 목록: [이모지, 이름]. 바꾸고 싶으면 이 목록만 고치면 돼요.
  var JOBS = [
    ['👩‍⚕️','의사'],['🧑‍🏫','교사'],['🧑‍🚒','소방관'],['👮','경찰관'],
    ['🧑‍🍳','요리사'],['🐶','수의사'],['🔬','과학자'],['💻','프로그래머'],
    ['✏️','웹툰 작가'],['🎬','유튜버'],['⚽','운동선수'],['🎤','가수'],
    ['🏗️','건축가'],['✈️','파일럿'],['📰','기자'],['🌱','농부']
  ];

  // 질문 종류: 체크 표시는 이 5가지 순서로 보여요. (기타는 체크 표시에 안 나와요)
  var ORDER = ['info','followup','feel','hope','advice'];
  var LABEL = { info:'정보', followup:'후속', feel:'생각·느낌', hope:'포부', advice:'당부', other:'기타' };

  var $ = function(id){ return document.getElementById(id); };
  var state = {
    name:'', job:'', emoji:'🙂',
    quota:{ info:3, followup:1, feel:1, hope:1, advice:1 }, total:7,
    counts:{}, asked:0, history:[], types:[], busy:false, feedback:null
  };
  var selectedJob = '';
  var toastTimer = null;

  function zeroCounts(){
    var c = { other: 0 };
    ORDER.forEach(function(t){ c[t] = 0; });
    return c;
  }
  state.counts = zeroCounts();

  function el(tag, cls, text){
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text !== undefined) e.textContent = text;
    return e;
  }

  async function api(path, body){
    var res = await fetch(path, {
      method: body ? 'POST' : 'GET',
      headers: { 'Content-Type': 'application/json' },
      body: body ? JSON.stringify(body) : undefined
    });
    var data = null;
    try { data = await res.json(); } catch (e) {}
    if (!res.ok) throw new Error((data && data.message) || '연결이 불안정해요. 잠시 후에 다시 해 보세요.');
    return data;
  }

  function toast(msg){
    var t = $('toast');
    t.textContent = msg;
    t.classList.remove('hidden');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function(){ t.classList.add('hidden'); }, 3200);
  }

  function showScreen(id){
    ['screenStart','screenInterview','screenResult','screenBlocked'].forEach(function(s){
      $(s).classList.toggle('hidden', s !== id);
    });
  }

  function currentJob(){
    var c = $('customJob').value.trim();
    return c || selectedJob;
  }

  function updateStartBtn(){
    $('startBtn').disabled = state.busy || !($('studentName').value.trim() && currentJob());
  }

  function setBusy(b){
    state.busy = b;
    $('sendBtn').disabled = b;
    $('feedbackBtn').disabled = b;
    updateStartBtn();
  }

  /* ── 시작 화면 ── */
  function renderJobs(){
    var grid = $('jobGrid');
    grid.innerHTML = '';
    JOBS.forEach(function(j){
      var b = el('button', 'job-btn');
      b.type = 'button';
      b.dataset.job = j[1];
      b.setAttribute('aria-pressed', 'false');
      b.appendChild(el('span', 'e', j[0]));
      b.appendChild(el('span', '', j[1]));
      b.addEventListener('click', function(){
        selectedJob = j[1];
        $('customJob').value = '';
        updateJobButtons();
        updateStartBtn();
      });
      grid.appendChild(b);
    });
  }

  function updateJobButtons(){
    document.querySelectorAll('.job-btn').forEach(function(b){
      b.setAttribute('aria-pressed', String(b.dataset.job === selectedJob));
    });
  }

  async function startInterview(){
    if (state.busy) return;
    var name = $('studentName').value.trim();
    var job = currentJob();
    if (!name || !job) return;
    var btn = $('startBtn');
    $('startMsg').textContent = '';
    setBusy(true);
    btn.textContent = '면담 상대를 모시는 중...';
    try {
      var data = await api('/api/start', { job: job });
      if (!data.ok) {
        $('startMsg').textContent = data.message || '직업 이름을 다시 확인해 주세요.';
      } else {
        state.name = name;
        state.job = data.job || job;
        state.emoji = data.emoji || '🙂';
        state.counts = zeroCounts();
        state.asked = 0;
        state.history = [];
        state.types = [];
        setupInterview(data.greeting);
        showScreen('screenInterview');
        setTimeout(function(){ $('qInput').focus(); }, 60);
      }
    } catch (e) {
      $('startMsg').textContent = e.message;
    } finally {
      btn.textContent = '면담 시작하기';
      setBusy(false);
    }
  }

  /* ── 면담 화면 ── */
  function setupInterview(greeting){
    $('tagEmoji').textContent = state.emoji;
    $('tagJob').textContent = state.job;
    $('chat').innerHTML = '';
    addBubble('them', greeting);
    renderProgress();
    $('compose').classList.remove('hidden');
    $('finishBar').classList.add('hidden');
    $('qInput').value = '';
  }

  function scrollChat(){
    var c = $('chat');
    c.scrollTop = c.scrollHeight;
  }

  function addBubble(who, text){
    var row = el('div', 'msg ' + who);
    row.appendChild(el('div', 'bubble', text));
    $('chat').appendChild(row);
    scrollChat();
    return row;
  }

  function addTyping(){
    var row = el('div', 'msg them');
    var b = el('div', 'bubble typing');
    b.appendChild(el('i')); b.appendChild(el('i')); b.appendChild(el('i'));
    row.appendChild(b);
    $('chat').appendChild(row);
    scrollChat();
    return row;
  }

  function renderProgress(){
    var box = $('checklist');
    box.innerHTML = '';
    ORDER.forEach(function(t){
      var done = Math.min(state.counts[t], state.quota[t]);
      var row = el('div', 'ck');
      row.setAttribute('aria-label', LABEL[t] + ' 질문 ' + state.quota[t] + '개 중 ' + done + '개 완료');
      row.appendChild(el('span', '', LABEL[t]));
      var dots = el('span', 'ck-dots');
      for (var i = 0; i < state.quota[t]; i++) {
        var on = i < state.counts[t];
        dots.appendChild(el('span', 'dot' + (on ? ' on' : ''), on ? '✔' : ''));
      }
      row.appendChild(dots);
      box.appendChild(row);
    });
    var left = state.total - state.asked;
    $('remain').textContent = left > 0 ? ('남은 질문 ' + left + '개') : '질문을 모두 했어요!';
  }

  async function sendQuestion(){
    if (state.busy || state.asked >= state.total) return;
    var input = $('qInput');
    var text = input.value.trim();
    if (!text) return;
    setBusy(true);
    input.value = '';
    var meRow = addBubble('me', text);
    var typing = addTyping();
    try {
      var data = await api('/api/chat', {
        job: state.job,
        history: state.history,
        types: state.types,
        question: text,
        name: state.name
      });
      typing.remove();
      if (data.blocked) {
        $('blockMsg').textContent = data.message || '성적이거나 폭력적인 질문은 할 수 없어요. 면담이 끝났어요.';
        showScreen('screenBlocked');
        return;
      }
      var type = (data.type in state.counts) ? data.type : 'other';
      state.history.push({ role: 'user', content: text });
      state.history.push({ role: 'assistant', content: data.reply });
      state.types.push(type);
      state.counts[type] += 1;
      state.asked += 1;
      addBubble('them', data.reply);
      renderProgress();
      if (data.done || state.asked >= state.total) {
        $('compose').classList.add('hidden');
        $('finishBar').classList.remove('hidden');
      }
    } catch (e) {
      typing.remove();
      meRow.remove();
      input.value = text;
      toast(e.message);
    } finally {
      setBusy(false);
      if (state.asked < state.total) input.focus();
    }
  }

  async function getFeedback(){
    if (state.busy) return;
    setBusy(true);
    $('overlay').classList.remove('hidden');
    try {
      var data = await api('/api/feedback', { job: state.job, history: state.history, types: state.types });
      renderResult(data.feedback);
      showScreen('screenResult');
      window.scrollTo(0, 0);
    } catch (e) {
      toast(e.message);
    } finally {
      $('overlay').classList.add('hidden');
      setBusy(false);
    }
  }

  /* ── 결과 화면 ── */
  function todayStr(){
    return new Date().toLocaleDateString('ko-KR', { year:'numeric', month:'long', day:'numeric' });
  }

  function starText(n){
    return '★'.repeat(n) + '☆'.repeat(3 - n);
  }

  function renderResult(fb){
    var sheet = $('sheet');
    sheet.innerHTML = '';
    sheet.appendChild(el('h2', '', state.emoji + ' ' + state.job + ' 인터뷰 결과'));
    var meta = el('div', 'meta');
    meta.appendChild(el('span', '', '이름: ' + state.name));
    meta.appendChild(el('span', '', '날짜: ' + todayStr()));
    sheet.appendChild(meta);

    sheet.appendChild(el('h3', '', '면담 내용'));
    for (var i = 0; i < state.asked; i++) {
      var qa = el('div', 'qa');
      var q = el('div', 'q');
      q.appendChild(el('span', 'badge', LABEL[state.types[i]]));
      q.appendChild(document.createTextNode('Q' + (i + 1) + '. ' + state.history[i * 2].content));
      qa.appendChild(q);
      qa.appendChild(el('div', 'a', 'A' + (i + 1) + '. ' + state.history[i * 2 + 1].content));
      sheet.appendChild(qa);
    }

    sheet.appendChild(el('h3', '', '선생님 피드백'));
    if (fb.summary) sheet.appendChild(el('p', 'summary', fb.summary));
    fb.criteria.forEach(function(c){
      var row = el('div', 'crit');
      var left = el('div');
      left.appendChild(el('span', 'name', c.name));
      var st = el('span', 'stars', starText(c.stars));
      st.setAttribute('aria-label', '별 3개 중 ' + c.stars + '개');
      left.appendChild(st);
      row.appendChild(left);
      row.appendChild(el('div', '', c.comment));
      sheet.appendChild(row);
    });
    if (fb.good) {
      var g = el('div', 'callout good');
      g.appendChild(el('b', '', '잘한 점'));
      g.appendChild(el('span', '', fb.good));
      sheet.appendChild(g);
    }
    if (fb.next) {
      var n = el('div', 'callout next');
      n.appendChild(el('b', '', '다음에는 이렇게 해 봐요'));
      n.appendChild(el('span', '', fb.next));
      sheet.appendChild(n);
    }
    state.feedback = fb;
  }

  function buildText(){
    var fb = state.feedback;
    var lines = [];
    lines.push('[' + state.job + ' 인터뷰 결과]');
    lines.push('이름: ' + state.name);
    lines.push('날짜: ' + todayStr());
    lines.push('');
    lines.push('■ 면담 내용');
    for (var i = 0; i < state.asked; i++) {
      lines.push('Q' + (i + 1) + ' [' + LABEL[state.types[i]] + ']. ' + state.history[i * 2].content);
      lines.push('A' + (i + 1) + '. ' + state.history[i * 2 + 1].content);
      lines.push('');
    }
    lines.push('■ 선생님 피드백');
    if (fb.summary) lines.push(fb.summary);
    fb.criteria.forEach(function(c){
      lines.push('- ' + c.name + ' ' + starText(c.stars) + ': ' + c.comment);
    });
    if (fb.good) lines.push('잘한 점: ' + fb.good);
    if (fb.next) lines.push('다음에는: ' + fb.next);
    return lines.join('\n');
  }

  async function copyText(){
    var text = buildText();
    try {
      await navigator.clipboard.writeText(text);
      toast('복사했어요! 제출하는 곳에 붙여넣기 해요.');
    } catch (e) {
      var ta = document.createElement('textarea');
      ta.value = text;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      try { document.execCommand('copy'); toast('복사했어요! 제출하는 곳에 붙여넣기 해요.'); }
      catch (err) { toast('복사가 안 돼요. 이미지로 저장해 보세요.'); }
      ta.remove();
    }
  }

  async function saveImage(){
    if (typeof html2canvas === 'undefined') {
      toast('이미지 저장 도구를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.');
      return;
    }
    try {
      var canvas = await html2canvas($('sheet'), { scale: 2, backgroundColor: '#ffffff', useCORS: true });
      canvas.toBlob(function(blob){
        if (!blob) { toast('이미지를 만들지 못했어요.'); return; }
        var url = URL.createObjectURL(blob);
        var a = document.createElement('a');
        a.href = url;
        a.download = ('직업인터뷰_' + state.name + '_' + state.job + '.png').replace(/\s+/g, '_');
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(function(){ URL.revokeObjectURL(url); }, 4000);
        toast('이미지를 저장했어요!');
      }, 'image/png');
    } catch (e) {
      toast('이미지 저장에 실패했어요. 텍스트 복사를 이용해 주세요.');
    }
  }

  function restart(){
    selectedJob = '';
    $('customJob').value = '';
    $('startMsg').textContent = '';
    state.counts = zeroCounts();
    state.asked = 0;
    state.history = [];
    state.types = [];
    state.feedback = null;
    updateJobButtons();
    updateStartBtn();
    showScreen('screenStart');
    window.scrollTo(0, 0);
  }

  /* ── 이벤트 연결 ── */
  $('studentName').addEventListener('input', updateStartBtn);
  $('customJob').addEventListener('input', function(){
    selectedJob = '';
    updateJobButtons();
    updateStartBtn();
  });
  $('startBtn').addEventListener('click', startInterview);
  $('sendBtn').addEventListener('click', sendQuestion);
  $('qInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter' && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      sendQuestion();
    }
  });
  $('feedbackBtn').addEventListener('click', getFeedback);
  $('copyBtn').addEventListener('click', copyText);
  $('imgBtn').addEventListener('click', saveImage);
  $('againBtn').addEventListener('click', restart);

  renderJobs();
  api('/api/config').then(function(c){
    if (c && c.quota && c.total) {
      state.quota = c.quota;
      state.total = c.total;
      $('qCountText').textContent = c.total;
    }
  }).catch(function(){});
})();
</script>
</body>
</html>
